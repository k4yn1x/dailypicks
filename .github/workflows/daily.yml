name: Daily refresh

on:
  schedule:
    # 07:00 Africa/Lagos (WAT, UTC+1, no daylight saving) = 06:00 UTC.
    - cron: "0 6 * * *"
    # Lighter fixture-status refresh in the European afternoon (before most kick-offs).
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run regardless of the local-time gate"
        default: "true"

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Run pipeline (gated to 07:00 Africa/Lagos unless forced)
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          TRIGGER: ${{ github.event_name }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: bash scripts/daily.sh
      - name: Commit ledger and published board
        run: |
          git config user.name "dailypicks-bot"
          git config user.email "dailypicks-bot@users.noreply.github.com"
          git add data/ledger.sqlite data/published data/promoted_priors.json data/watchlist/watchlist.json data/eval/test_frozen.json
          git diff --cached --quiet || git commit -m "refresh: $(date -u +%FT%TZ) [skip ci]"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/pages
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
